services:
  - type: web
    name: maps
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: ADMIN_PASS
        sync: false
