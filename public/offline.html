<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Trips</title>
  <style>
    html,body { margin:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#F2F2F7; color:#000; }
    main { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; text-align:center; }
    h1 { margin:0 0 10px; font-size:22px; }
    p { margin:0 0 22px; color:#6C6C70; line-height:1.5; }
    button { background:#1A73E8; color:#fff; border:0; border-radius:22px; padding:12px 22px; font-size:16px; font-weight:700; }
    @media (prefers-color-scheme: dark) {
      html,body { background:#000; color:#fff; }
      p { color:#8E8E93; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Can't reach Trips</h1>
    <p>Check your connection, then try again. Your saved trips stay on this phone.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </main>
</body>
</html>
