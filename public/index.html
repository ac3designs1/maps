<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Trips"/>
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme:light)"/>
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme:dark)"/>
  <meta name="color-scheme" content="light dark"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"/>
  <link rel="apple-touch-icon" href="icon-180.png"/>
  <link rel="icon" href="icon.svg"/>
  <title>Trips</title>
  <link rel="stylesheet" href="vendor/leaflet.css?v=55"/>
  <link rel="stylesheet" href="styles.css?v=55"/>
</head>
<body>

<div id="map"></div>

<!-- ═══════════════════════════════════════
     TRIP LIST SCREEN
═══════════════════════════════════════ -->
<section id="listScreen" class="screen-list">
  <header class="list-header">
    <div class="list-title">
      <p class="eyebrow">Maps</p>
      <h1>Trips</h1>
    </div>
    <button id="btnNew" class="fab-new" aria-label="New trip">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
    <input id="tripSearch" type="search" placeholder="Search trips" enterkeyhint="search" inputmode="search" autocomplete="off" autocorrect="off" spellcheck="false"/>
    <button id="searchClear" class="search-clear hidden" type="button" aria-label="Clear search">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div id="offlineBanner" class="offline-banner hidden">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.56 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
    Offline — trips saved on this device
  </div>

  <button id="continueCard" class="continue-card hidden">
    <div class="continue-icon">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </div>
    <div class="continue-text">
      <strong id="continueTitle">Continue trip</strong>
      <span id="continueSub"></span>
    </div>
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--muted);flex-shrink:0"><path d="M9 18l6-6-6-6"/></svg>
  </button>

  <div id="tripList" class="trip-list"></div>

  <div id="emptyState" class="empty-state">
    <div class="empty-icon">
      <svg viewBox="0 0 48 48" width="48" height="48" fill="none"><circle cx="24" cy="24" r="22" fill="rgba(26,115,232,.1)"/><path d="M24 12c-5.5 0-10 4.5-10 10 0 7.5 10 18 10 18s10-10.5 10-18c0-5.5-4.5-10-10-10zm0 13.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" fill="#1A73E8"/></svg>
    </div>
    <h2>No trips yet</h2>
    <p>Add addresses, optimise your route,<br>and navigate stop by stop.</p>
    <button id="btnEmptyNew" class="btn-primary" type="button">Start a trip</button>
  </div>
</section>

<!-- ═══════════════════════════════════════
     PLANNER SCREEN
═══════════════════════════════════════ -->
<section id="tripScreen" class="screen-planner">
  <div class="map-controls">
    <button id="btnBack" class="map-btn" aria-label="Back">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </button>
    <button id="btnLocate" class="map-btn" aria-label="My location">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
  </div>

  <div id="suggestBox" class="suggest-box hidden"></div>

  <div id="sheet" class="sheet snap-mid">
    <div id="sheetHandle" class="sheet-handle"><span></span></div>

    <!-- summary row -->
    <div class="summary-row">
      <div class="summary-text">
        <strong id="summaryTime">Add a destination</strong>
        <span id="summaryMeta">Search below or tap + Stop</span>
      </div>
      <button id="btnMapToggle" class="pill-btn" aria-label="Map or list">
        <svg id="mapToggleIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 6l7-3 8 3 7-3v15l-7 3-8-3-7 3V6z"/><path d="M8 3v15M16 6v15"/></svg>
        <span id="mapToggleLabel" class="vh">Map</span>
      </button>
      <button id="btnStart" class="btn-start" disabled>Start</button>
    </div>

    <!-- navigation bar (hidden unless navigating) -->
    <div id="navBar" class="nav-bar hidden">
      <div class="nav-info">
        <strong id="navTitle">Next stop</strong>
        <span id="navSub"></span>
      </div>
      <button id="btnNext" class="btn-go">Go</button>
    </div>

    <!-- optimise nudge -->
    <div id="optimiseNudge" class="optimise-nudge hidden">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01z"/></svg>
      <span>Route could be shorter — </span>
      <button id="nudgeOptimise">Optimise</button>
      <button id="nudgeDismiss" aria-label="Dismiss">✕</button>
    </div>

    <!-- stop list -->
    <div id="stopList" class="stop-list"></div>

    <!-- action row -->
    <div class="action-row">
      <button id="btnAddStop"  class="action-chip">+ Stop</button>
      <button id="btnOptimise" class="action-chip hidden">Optimise</button>
      <button id="btnMore"     class="action-chip">More</button>
    </div>
    <div class="hidden" aria-hidden="true">
      <button id="btnPaste" type="button">Paste</button>
      <button id="btnReverse" type="button">Reverse</button>
      <button id="btnShare" type="button">Share</button>
    </div>
  </div>
</section>

<!-- ═══════════════════════════════════════
     BOTTOM MODAL
═══════════════════════════════════════ -->
<div id="modal" class="modal hidden">
  <div id="modalBack" class="modal-back"></div>
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <button id="modalClose" class="modal-close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════
     TOAST
═══════════════════════════════════════ -->
<div id="toast" class="toast hidden">
  <span id="toastMsg"></span>
  <button id="toastUndo" class="toast-undo hidden">Undo</button>
</div>

<div id="installBanner" class="install-banner hidden">
  <div class="install-icon">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v13M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
  </div>
  <div class="install-text">
    <strong id="installTitle">Add to Home Screen</strong>
    <span id="installSub">Get the full app experience</span>
  </div>
  <button id="installBtn" class="install-action">Add</button>
  <button id="installDismiss" class="install-dismiss" aria-label="Dismiss">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
</div>

<div id="iosTooltip" class="ios-tooltip hidden">
  <div class="ios-tooltip-arrow"></div>
  <div class="ios-tooltip-body">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex-shrink:0"><path d="M12 2v13M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    <span>Tap <strong>Share</strong> then <strong>Add to Home Screen</strong></span>
    <button id="iosClose" class="ios-close" aria-label="Dismiss">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
</div>

<script src="vendor/leaflet.js?v=55"></script>
<script src="app.js?v=55"></script>
</body>
</html>
