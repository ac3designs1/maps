<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Trips" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" />
  <title>Trips</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css?v=8" />
</head>
<body>
  <div id="map"></div>

  <section id="listScreen" class="screen list">
    <header class="page-head">
      <div>
        <p class="kicker">Maps</p>
        <h1>Trips</h1>
      </div>
      <button type="button" id="btnNew" class="icon-fab" aria-label="New trip">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>
    <div class="search-row">
      <svg class="search-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
      <input id="tripSearch" type="search" placeholder="Search" enterkeyhint="search" />
    </div>
    <div id="netBanner" class="net-banner hidden">You’re offline — trips still save on this phone.</div>
    <button type="button" id="continueCard" class="continue hidden"></button>
    <div id="tripList" class="trip-list grouped"></div>
    <div id="tripEmpty" class="empty-hero">
      <div class="empty-art" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="56" height="56"><path d="M32 8c-9 0-16 7-16 16 0 12 16 28 16 28s16-16 16-28c0-9-7-16-16-16zm0 22a6 6 0 1 1 0-12 6 6 0 0 1 0 12z" fill="#1a73e8"/></svg>
      </div>
      <h2>Plan a trip</h2>
      <p>Drop in as many addresses as you want. Autocomplete, optimize the drive, and come back anytime — no 10-stop limit.</p>
      <button type="button" id="btnEmptyNew" class="btn primary">New trip</button>
    </div>
  </section>

  <section id="tripScreen" class="screen trip hidden">
    <button type="button" id="btnBack" class="map-fab back" aria-label="Back">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 19l-7-7 7-7"/></svg>
    </button>
    <button type="button" id="btnLocate" class="map-fab locate" aria-label="My location">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>
    </button>
    <div id="suggestPop" class="suggest-pop hidden"></div>
    <div id="plannerSheet" class="planner snap-mid">
      <div id="sheetGrab" class="grab"><span></span></div>
      <div class="eta-row">
        <div class="eta">
          <strong id="etaMain">Add two places</strong>
          <span id="etaSub">Unlimited stops</span>
        </div>
        <button type="button" id="btnStart" class="btn primary" disabled>Start</button>
      </div>
      <div id="navBar" class="nav-bar hidden">
        <div>
          <strong id="navTitle">Next stop</strong>
          <span id="navSub"></span>
        </div>
        <button type="button" id="btnNext" class="btn primary small">Go</button>
      </div>
      <div id="stopList" class="stop-list"></div>
      <div class="plan-actions">
        <button type="button" id="btnAddStop" class="chip">Add stop</button>
        <button type="button" id="btnPaste" class="chip">Paste</button>
        <button type="button" id="btnReverse" class="chip">Reverse</button>
        <button type="button" id="btnOptimize" class="chip">Optimize</button>
        <button type="button" id="btnShare" class="chip">Share</button>
        <button type="button" id="btnMore" class="chip">More</button>
      </div>
      <p class="map-credit">Map data © OpenStreetMap</p>
    </div>
  </section>

  <div id="sheet" class="modal hidden" aria-hidden="true">
    <div class="sheet-back" id="sheetBack"></div>
    <div class="sheet-panel">
      <div class="sheet-grab"></div>
      <h2 id="sheetTitle">More</h2>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden">
    <span id="toastMsg"></span>
    <button type="button" id="toastAct" class="toast-act hidden">Undo</button>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
