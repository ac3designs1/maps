<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Trips" />
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" />
  <title>Trips</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css?v=12" />
</head>
<body>

  <div id="map"></div>

  <!-- ── Trip list ── -->
  <section id="listScreen" class="screen list">
    <header class="page-head">
      <div>
        <p class="kicker">Maps</p>
        <h1>Trips</h1>
      </div>
      <button id="btnNew" class="icon-fab" aria-label="New trip">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>
    <div class="search-row">
      <svg class="search-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
      <input id="tripSearch" type="search" placeholder="Search trips" enterkeyhint="search" />
    </div>
    <div id="netBanner" class="net-banner hidden">You're offline — trips still saved on this phone.</div>
    <button id="continueCard" class="continue hidden"></button>
    <div id="tripList" class="trip-list"></div>
    <div id="tripEmpty" class="empty-hero">
      <div class="empty-art" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="60" height="60"><path d="M32 8c-9 0-16 7-16 16 0 12 16 28 16 28S48 36 48 24c0-9-7-16-16-16zm0 22a6 6 0 1 1 0-12 6 6 0 0 1 0 12z" fill="#007AFF" opacity=".15"/><path d="M32 10c-7.7 0-14 6.3-14 14 0 10 14 26 14 26S46 34 46 24c0-7.7-6.3-14-14-14zm0 20a6 6 0 1 1 0-12 6 6 0 0 1 0 12z" fill="#007AFF"/></svg>
      </div>
      <h2>Plan a trip</h2>
      <p>Add as many stops as you need. Autocomplete, optimise the drive, and come back any time.</p>
      <button id="btnEmptyNew" class="btn primary">New trip</button>
    </div>
  </section>

  <!-- ── Trip planner ── -->
  <section id="tripScreen" class="screen trip hidden">
    <button id="btnBack" class="fab back" aria-label="Back to trips">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 19l-7-7 7-7"/></svg>
    </button>
    <button id="btnLocate" class="fab locate" aria-label="My location">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>

    <div id="suggestPop" class="suggest-pop hidden"></div>

    <div id="plannerSheet" class="planner snap-mid">
      <div id="sheetGrab" class="grab"><span></span></div>

      <div class="eta-row">
        <div class="eta">
          <strong id="etaMain">Add two places</strong>
          <span id="etaSub">Unlimited stops</span>
        </div>
        <button id="btnMap" class="btn-map" aria-label="Toggle map preview">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 6l7-3 8 3 7-3v15l-7 3-8-3-7 3V6z"/><path d="M8 3v15M16 6v15"/></svg>
          Map
        </button>
        <button id="btnStart" class="btn primary small" disabled>Start</button>
      </div>

      <div id="navBar" class="nav-bar hidden">
        <div style="flex:1;min-width:0">
          <strong id="navTitle">Next stop</strong>
          <span id="navSub"></span>
        </div>
        <button id="btnNext" class="btn primary small">Go</button>
      </div>

      <div id="stopList" class="stop-list"></div>

      <div class="plan-actions">
        <button id="btnAddStop" class="chip">+ Stop</button>
        <button id="btnPaste"   class="chip">Paste list</button>
        <button id="btnReverse" class="chip">Reverse</button>
        <button id="btnOptimize" class="chip">Optimise</button>
        <button id="btnShare"   class="chip">Share</button>
        <button id="btnMore"    class="chip">More…</button>
      </div>
      <p class="map-credit">Map © OpenStreetMap contributors</p>
    </div>
  </section>

  <!-- ── Bottom modal sheet ── -->
  <div id="sheet" class="modal hidden" aria-hidden="true">
    <div class="sheet-back" id="sheetBack"></div>
    <div class="sheet-panel">
      <div class="sheet-grab"></div>
      <h2 id="sheetTitle"></h2>
      <div id="sheetBody"></div>
    </div>
  </div>

  <!-- ── Toast ── -->
  <div id="toast" class="toast hidden">
    <span id="toastMsg"></span>
    <button id="toastAct" class="toast-act hidden">Undo</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=12"></script>
</body>
</html>
