<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Trips" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" />
  <title>Trips</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <div id="map"></div>
  <button type="button" id="btnLocate" class="map-fab locate hidden" aria-label="My location">◎</button>

  <section id="listScreen" class="screen list">
    <header class="page-head">
      <div>
        <p class="kicker">Planner</p>
        <h1>Trips</h1>
      </div>
      <button type="button" id="btnNew" class="icon-fab" aria-label="New trip">+</button>
    </header>
    <div class="search-row">
      <input id="tripSearch" type="search" placeholder="Search trips" enterkeyhint="search" />
    </div>
    <div id="tripList" class="trip-list"></div>
    <p id="tripEmpty" class="empty">Tap + and drop in as many addresses as you want. No 10-stop limit. It saves itself.</p>
  </section>

  <section id="tripScreen" class="screen trip hidden">
    <button type="button" id="btnBack" class="map-fab back" aria-label="Back">‹</button>
    <div id="suggestPop" class="suggest-pop hidden"></div>
    <div id="plannerSheet" class="planner snap-mid">
      <div id="sheetGrab" class="grab"><span></span></div>
      <div class="eta-row">
        <div class="eta">
          <strong id="etaMain">Add two places</strong>
          <span id="etaSub">Unlimited stops · auto-saves</span>
        </div>
        <button type="button" id="btnStart" class="btn primary" disabled>Start</button>
      </div>
      <div id="navBar" class="nav-bar hidden">
        <div>
          <strong id="navTitle">Next stop</strong>
          <span id="navSub"></span>
        </div>
        <button type="button" id="btnNext" class="btn primary small">Next</button>
      </div>
      <div id="stopList" class="stop-list"></div>
      <div class="plan-actions">
        <button type="button" id="btnAddStop" class="chip">+ Add stop</button>
        <button type="button" id="btnPaste" class="chip">Paste list</button>
        <button type="button" id="btnReverse" class="chip">Reverse</button>
        <button type="button" id="btnOptimize" class="chip">Optimize</button>
        <button type="button" id="btnMore" class="chip">More</button>
      </div>
    </div>
  </section>

  <div id="sheet" class="modal hidden" aria-hidden="true">
    <div class="sheet-back" id="sheetBack"></div>
    <div class="sheet-panel">
      <div class="sheet-grab"></div>
      <h2 id="sheetTitle">More</h2>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
