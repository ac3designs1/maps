# Codemagic cloud builds for Trips (Windows → App Store).
#
# One-time setup (Codemagic UI, not this file):
# 1. Paid Apple Developer Program
# 2. Team integrations → App Store Connect API key, name it exactly: codemagic
#    (App Store Connect → Users and Access → Integrations → App Store Connect API → App Manager key)
# 3. App Store Connect → New App, bundle id com.ac3designs.trips
# 4. Optional env var APP_STORE_APP_ID = the number from App Information
#
# This workflow creates the App Store cert + profile on Apple if they do not exist yet.

workflows:
  ios-app-store:
    name: Trips iOS (TestFlight)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      vars:
        BUNDLE_ID: com.ac3designs.trips
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch or create App Store signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          BUILD_TO_USE="${BUILD_NUMBER}"
          if [ -n "${APP_STORE_APP_ID:-}" ]; then
            LATEST="$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || true)"
            if [ -z "$LATEST" ] || [ "$LATEST" = "None" ]; then
              LATEST="$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)"
            fi
            case "$LATEST" in
              ''|*[!0-9]*) LATEST=0 ;;
            esac
            BUILD_TO_USE="$((LATEST + 1))"
          fi
          agvtool new-version -all "$BUILD_TO_USE"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
